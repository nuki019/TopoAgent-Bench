[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topoagent-bench"
version = "0.1.0"
description = "High-Performance Multi-Agent Workflow Engine & Benchmark with DyLAN Pruning and MCTS Optimization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "TopoAgent-Bench Team" }
]
keywords = [
    "multi-agent",
    "topological-sort",
    "dylan",
    "workflow-optimization",
    "mcts",
    "llm-benchmarking"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["topoagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
